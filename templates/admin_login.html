{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<section class="section" style="padding-top:0; max-width:440px; margin:0 auto;">
  <h2>Placement Cell &mdash; Admin Login</h2>
  <form class="panel" method="POST">
    <div class="field" style="margin-bottom:18px;">
      <label>Username</label>
      <input type="text" name="username" required>
    </div>
    <div class="field" style="margin-bottom:22px;">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
  </form>
  <p class="hint" style="margin-top:14px;">Default admin credentials: <b>admin</b> / <b>admin123</b> &mdash; change this in production.</p>
</section>
{% endblock %}
