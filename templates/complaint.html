{% extends "base.html" %}
{% block title %}Raise a Complaint{% endblock %}
{% block content %}
<section class="section" style="padding-top:0; max-width:600px; margin:0 auto;">
  <h2>Raise a Complaint / Query</h2>
  <form class="panel" method="POST">
    <div class="field" style="margin-bottom:18px;">
      <label>Subject</label>
      <input type="text" name="subject" required>
    </div>
    <div class="field" style="margin-bottom:22px;">
      <label>Message</label>
      <textarea name="message" required></textarea>
    </div>
    <button type="submit" class="btn btn-gold">Submit</button>
    <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline">Cancel</a>
  </form>
</section>
{% endblock %}
